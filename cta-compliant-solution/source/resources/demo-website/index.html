<!DOCTYPE html>
<html>
<head>
    <title>CTA-5007-B Secure Media Demo</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .video-container { margin: 20px 0; }
        .controls { margin: 20px 0; padding: 20px; background: #f5f5f5; }
        .token-info { margin: 10px 0; padding: 10px; background: #e8f4fd; }
        button { padding: 10px 20px; margin: 5px; }
        input, select { padding: 8px; margin: 5px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CTA-5007-B Secure Media Delivery Demo</h1>
        
        <div class="controls">
            <h3>Generate Secure Token</h3>
            
            <label>Media URL:</label><br>
            <input type="text" id="mediaUrl" value="https://example.cloudfront.net/video/sample.m3u8" style="width: 100%"><br>
            
            <label>Path Restriction:</label>
            <input type="text" id="pathRestriction" value="/video/" placeholder="/video/"><br>
            
            <label>TTL:</label>
            <select id="ttl">
                <option value="1h">1 hour</option>
                <option value="2h" selected>2 hours</option>
                <option value="24h">24 hours</option>
            </select>
            
            <label>Country Restriction:</label>
            <input type="text" id="countries" placeholder="us,ca,gb (comma separated)"><br>
            
            <label>Token Placement:</label>
            <select id="placement">
                <option value="path" selected>Path (/TOKEN/video/)</option>
                <option value="query">Query (?CAT=TOKEN)</option>
                <option value="header">Header (CTA-Common-Access-Token)</option>
            </select><br>
            
            <button onclick="generateToken()">Generate CTA Token</button>
            <button onclick="revokeCurrentToken()" id="revokeBtn" disabled>Revoke Token</button>
        </div>
        
        <div class="token-info" id="tokenInfo" style="display: none;">
            <h4>Generated Token Info</h4>
            <p><strong>Token ID:</strong> <span id="tokenId"></span></p>
            <p><strong>Expires:</strong> <span id="expiresAt"></span></p>
            <p><strong>Signed URL:</strong></p>
            <textarea id="signedUrl" readonly style="width: 100%; height: 60px;"></textarea>
        </div>
        
        <div class="video-container">
            <video id="videoPlayer" controls width="100%" style="display: none;">
                Your browser does not support the video tag.
            </video>
        </div>
        
        <div id="messages"></div>
    </div>

    <script src="cta-sdk.js"></script>
    <script>
        const API_ENDPOINT = '/api'; // Will be replaced with actual API Gateway URL
        const client = new CTAClient(API_ENDPOINT);
        let currentTokenId = null;
        
        function showMessage(message, isError = false) {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = `<p class="${isError ? 'error' : 'success'}">${message}</p>`;
            setTimeout(() => messagesDiv.innerHTML = '', 5000);
        }
        
        async function generateToken() {
            try {
                const mediaUrl = document.getElementById('mediaUrl').value;
                const pathRestriction = document.getElementById('pathRestriction').value;
                const ttl = document.getElementById('ttl').value;
                const countries = document.getElementById('countries').value;
                const placement = document.getElementById('placement').value;
                
                const policy = {
                    paths: pathRestriction ? [pathRestriction] : undefined,
                    ttl: ttl,
                    countries: countries ? countries.split(',').map(c => c.trim()) : undefined,
                    placement: placement,
                    sessionId: 'demo-' + Date.now()
                };
                
                const viewer = {
                    country: 'us', // Simulated viewer country
                    ip: '192.168.1.100' // Simulated viewer IP
                };
                
                showMessage('Generating CTA-5007-B token...');
                
                const result = await client.generateToken(policy, viewer, mediaUrl);
                
                // Update UI
                document.getElementById('tokenId').textContent = result.token.substring(0, 20) + '...';
                document.getElementById('expiresAt').textContent = new Date(result.expiresAt * 1000).toLocaleString();
                document.getElementById('signedUrl').value = result.signedUrl;
                document.getElementById('tokenInfo').style.display = 'block';
                document.getElementById('revokeBtn').disabled = false;
                
                currentTokenId = policy.sessionId;
                
                // Load video if it's a video URL
                if (mediaUrl.includes('.m3u8') || mediaUrl.includes('.mp4')) {
                    const video = document.getElementById('videoPlayer');
                    video.src = result.signedUrl;
                    video.style.display = 'block';
                }
                
                showMessage('CTA token generated successfully!');
                
            } catch (error) {
                showMessage(`Error: ${error.message}`, true);
            }
        }
        
        async function revokeCurrentToken() {
            if (!currentTokenId) return;
            
            try {
                showMessage('Revoking token...');
                
                await client.revokeToken(currentTokenId, 'manual_demo');
                
                document.getElementById('revokeBtn').disabled = true;
                document.getElementById('videoPlayer').style.display = 'none';
                
                showMessage('Token revoked successfully!');
                
            } catch (error) {
                showMessage(`Revocation error: ${error.message}`, true);
            }
        }
        
        // Auto-populate with demo values
        window.onload = function() {
            showMessage('CTA-5007-B Demo Ready - Generate a token to test secure media delivery');
        };
    </script>
</body>
</html>
