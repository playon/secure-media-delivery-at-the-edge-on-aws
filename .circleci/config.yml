version: 2.1

# CircleCI pipeline for the CTASecureMedia Terraform stack.
#
# Fork of aws-solutions-library-samples/secure-media-delivery-at-the-edge-on-aws.
# See VID-3417 (original CDK deploy) and VID-3439 (Terraform port) for context.
#
# Trigger: every push runs static-checks (fmt + validate, no AWS).
# Branches run plan-only (read state, no apply). main runs plan → approve →
# apply. Prod is a placeholder no-op until CTA rollout gets past the
# initial stage-only phase.
#
# AWS auth: video-team convention (per Ion, DO-1833). CircleCI GOFAN_OPS
# context supplies runner AWS creds; the aws provider in
# terraform/providers.tf assume_role's into a per-repo deployer role.
# See docs/CIRCLECI.md.

parameters:
  terraform_version:
    type: string
    default: "1.9.8"
  node_version:
    type: string
    default: "22.11"

commands:
  install_terraform:
    description: Install a pinned Terraform CLI
    steps:
      - run:
          name: Install Terraform << pipeline.parameters.terraform_version >>
          command: |
            set -eux
            TF_VER="<< pipeline.parameters.terraform_version >>"
            curl -fsSL -o terraform.zip "https://releases.hashicorp.com/terraform/${TF_VER}/terraform_${TF_VER}_linux_amd64.zip"
            unzip -o terraform.zip -d "$HOME/.local/bin"
            rm -f terraform.zip
            echo 'export PATH=$HOME/.local/bin:$PATH' >> "$BASH_ENV"
            "$HOME/.local/bin/terraform" version

  install_lambda_deps:
    description: |
      Install Node lambda deps so archive_file zips them in. The Node
      lambdas declare cbor-x + @aws-sdk/* in package.json — if node_modules
      is missing at plan time, apply will ship an incomplete zip and
      generator invocations will crash on cold start.
    steps:
      - run:
          name: npm install (source/lambda + sync_keys)
          command: |
            set -eux
            npm install --omit=dev --no-audit --no-fund --prefix source/lambda
            npm install --omit=dev --no-audit --no-fund --prefix source/lambda/sync_keys

jobs:
  # fmt + validate — no AWS creds, runs on every branch so PRs get
  # signal before merge. Skips gracefully if terraform/ doesn't exist
  # yet (defensive — the port was merged in VID-3439 PR #4).
  static-checks:
    docker:
      - image: cimg/base:2024.11
    steps:
      - checkout
      - run:
          name: Skip if terraform/ absent (VID-3439 port not yet merged)
          command: |
            if [ ! -d terraform ]; then
              echo "terraform/ not present on this ref — skipping static checks."
              circleci-agent step halt
            fi
      - install_terraform
      - run:
          name: terraform fmt -check -recursive
          working_directory: terraform
          command: terraform fmt -check -recursive -diff
      - run:
          name: terraform init -backend=false
          working_directory: terraform
          command: terraform init -backend=false -input=false
      - run:
          name: terraform validate
          working_directory: terraform
          command: terraform validate

  # VID-3464: jest unit tests for the validator CloudFront Function.
  # Scoped to source/lambda/__tests__/ — blackout_sync uses node:test.
  unit-tests:
    docker:
      - image: cimg/node:<< pipeline.parameters.node_version >>
    steps:
      - checkout
      - run:
          name: npm install (source/lambda, includes jest dev dep)
          command: npm install --no-audit --no-fund --prefix source/lambda
      - run:
          name: jest
          command: npm test --prefix source/lambda

  plan-stage:
    docker:
      - image: cimg/node:<< pipeline.parameters.node_version >>
    steps:
      - checkout
      - install_terraform
      - install_lambda_deps
      - run:
          name: terraform init
          working_directory: terraform
          command: terraform init -input=false
      - run:
          name: terraform workspace select nfhs-staging-us-east-1
          working_directory: terraform
          command: |
            terraform workspace new nfhs-staging-us-east-1 || terraform workspace select nfhs-staging-us-east-1
      - run:
          name: terraform plan -out=tfplan.binary
          working_directory: terraform
          command: |
            terraform plan \
              -input=false \
              -var-file=envs/nfhs-staging-us-east-1.tfvars \
              -out=tfplan.binary
            terraform show -no-color tfplan.binary > tfplan.txt
            terraform show -json tfplan.binary > tfplan.json
      - store_artifacts:
          path: terraform/tfplan.txt
          destination: plan/nfhs-staging.txt
      - store_artifacts:
          path: terraform/tfplan.json
          destination: plan/nfhs-staging.json
      - persist_to_workspace:
          root: terraform
          paths:
            - tfplan.binary
            - .terraform
            - .terraform.lock.hcl

  apply-stage:
    docker:
      - image: cimg/node:<< pipeline.parameters.node_version >>
    steps:
      - checkout
      - install_terraform
      - install_lambda_deps
      - attach_workspace:
          at: terraform
      - run:
          name: terraform apply tfplan.binary
          working_directory: terraform
          command: |
            terraform workspace select nfhs-staging-us-east-1
            terraform apply -input=false -auto-approve tfplan.binary
      - run:
          name: terraform output (post-apply)
          working_directory: terraform
          command: terraform output -json | tee ../tf-outputs-stage.json

  apply-prod:
    docker:
      - image: cimg/base:2024.11
    steps:
      - run:
          name: Prod apply not yet wired
          command: |
            echo "Prod pipeline is a skeleton placeholder — CTA is stage-only"
            echo "through the initial rollout. Wire the real apply step when"
            echo "promoting to prod. See VID-3417 / VID-3439 for context."

workflows:
  cta-secure-media:
    jobs:
      # Runs on ALL branches so PRs targeting main get fmt+validate
      # signal before merge. No AWS creds so it's cheap and safe.
      - static-checks

      # VID-3464: validator jest suite. No AWS creds, no network, cheap.
      # Runs on every branch so PRs surface regressions before plan.
      - unit-tests

      # PR branches: plan-only. Reviewers get the actual tfplan diff
      # as an artifact when looking at the PR. Read-only from AWS's
      # perspective; workflow filters prevent chaining to apply.
      - plan-stage:
          name: plan-branch
          context:
            - GOFAN_OPS
          filters:
            branches:
              ignore: main
          requires:
            - static-checks
            - unit-tests

      # main: plan → approve → apply. Only branch that can actually
      # mutate AWS beyond read-only plan operations.
      - plan-stage:
          name: plan-main
          context:
            - GOFAN_OPS
          filters:
            branches:
              only: main
          requires:
            - static-checks
            - unit-tests

      - approve-stage:
          type: approval
          filters:
            branches:
              only: main
          requires:
            - plan-main

      - apply-stage:
          context:
            - GOFAN_OPS
          filters:
            branches:
              only: main
          requires:
            - approve-stage

      - approve-prod:
          type: approval
          filters:
            branches:
              only: main
          requires:
            - apply-stage

      - apply-prod:
          filters:
            branches:
              only: main
          requires:
            - approve-prod
